name: Deploy to Unikraft Cloud

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "项目名（留空 = 用仓库名）"
        required: false
        type: string
      regions:
        description: "选择 Unikraft 部署地区"
        required: false
        type: choice
        default: sin - 新加坡
        options:
          - sin - 新加坡
          - dal - 美国达拉斯
          - fra - 德国法兰克福
          - sfo - 美国旧金山
          - was - 美国华盛顿特区
      memory_mb:
        description: "内存 MB"
        required: false
        type: string
      port:
        description: "应用监听端口"
        required: false
        type: string

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
      PROJECT_NAME: ${{ inputs.project_name || vars.PROJECT_NAME }}
      REGIONS: ${{ inputs.regions || vars.DEPLOY_REGIONS || 'fra,sin' }}
      MEMORY_MB: ${{ inputs.memory_mb || vars.MEMORY_MB || '1024' }}
      APP_PORT: ${{ inputs.port || vars.APP_PORT || '3000' }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 unikraft CLI
        run: |
          VER=v0.4.2
          curl -sL -o /tmp/u.tgz "https://github.com/unikraft-cloud/cli/releases/download/${VER}/unikraft-cli_0.4.2_linux_amd64.tar.gz"
          tar xzf /tmp/u.tgz -C /tmp
          sudo mv /tmp/unikraft /usr/local/bin/unikraft

      - name: 准备 rootfs
        run: bash scripts/deploy.sh prepare

      - id: build
        name: 构建并推送镜像
        run: bash scripts/deploy.sh build

      - name: 部署实例
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/deploy.sh deploy
