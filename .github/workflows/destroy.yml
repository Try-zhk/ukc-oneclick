name: Destroy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "留空 = 清空账号下全部资源；填项目名（如 woserwe）= 只删该项目"
        required: false
        type: string
        default: ""

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 unikraft CLI
        run: |
          VER=v0.4.2
          curl -sL -o /tmp/u.tgz "https://github.com/unikraft-cloud/cli/releases/download/${VER}/unikraft-cli_0.4.2_linux_amd64.tar.gz"
          tar xzf /tmp/u.tgz -C /tmp
          sudo mv /tmp/unikraft /usr/local/bin/unikraft

      - name: 删除资源
        run: |
          set -e
          TARGET=$(printf '%s' "${{ inputs.target }}" | tr '[:upper:]' '[:lower:]' | xargs)
          TOKEN="$UNIKRAFT_API_TOKEN"
          ORG=$(printf '%s' "$TOKEN" | base64 -d | cut -d: -f1 | sed -e 's/^robot\$//' -e 's/\.users\.kraftcloud$//')
          printf '%s' "$TOKEN" | unikraft login --token=- --organization "$ORG" >/dev/null

          # 留空 = all（清空全部）
          if [ -z "$TARGET" ] || [ "$TARGET" = "all" ]; then
            echo "== 清空全部资源 =="

            echo "-- 实例 --"
            unikraft instances list -o json 2>/dev/null | jq -r '.[].name' | sort -u | while read -r n; do
              [ -n "$n" ] || continue
              echo "  删除实例 $n"; unikraft instances delete "$n" --force || true
            done
            sleep 3

            echo "-- 服务 --"
            unikraft services list -o json 2>/dev/null | jq -r '.[].name' | sort -u | while read -r n; do
              [ -n "$n" ] || continue
              echo "  删除服务 $n"; unikraft services delete "$n" || true
            done

            echo "-- 镜像 --"
            unikraft images list -o json 2>/dev/null | jq -r '.[].ref' | sort -u | while read -r r; do
              [ -n "$r" ] || continue
              echo "  删除镜像 $r"; unikraft images delete "$ORG/$(basename "$r")" || true
            done
          else
            # 项目名白名单校验，防止注入
            printf '%s' "$TARGET" | grep -qE '^[a-z0-9][a-z0-9-]*$' || { echo "✗ 项目名只能含小写字母/数字/连字符：$TARGET"; exit 1; }
            echo "== 删除项目 [$TARGET] =="

            echo "-- 实例（含所有地区同名实例）--"
            unikraft instances list -o json 2>/dev/null | jq -r --arg n "$TARGET" '.[] | select(.name == $n) | .name' | sort -u | while read -r n; do
              [ -n "$n" ] || continue
              echo "  删除实例 $n"; unikraft instances delete "$n" --force || true
            done
            sleep 3

            echo "-- 服务（$TARGET-开头）--"
            unikraft services list -o json 2>/dev/null | jq -r --arg p "$TARGET-" '.[].name | select(startswith($p))' | sort -u | while read -r s; do
              [ -n "$s" ] || continue
              echo "  删除服务 $s"; unikraft services delete "$s" || true
            done

            echo "-- 镜像 --"
            echo "  删除镜像 $ORG/$TARGET"; unikraft images delete "$ORG/$TARGET" || true
          fi

          echo ""
          echo "== 剩余检查 =="
          unikraft instances list -o json 2>/dev/null | jq -r 'length' | xargs -I{} echo "剩余实例: {}"
          unikraft services list -o json 2>/dev/null | jq -r 'length' | xargs -I{} echo "剩余服务: {}"
