name: Destroy All

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "输入 DELETE 确认清空所有实例/服务/镜像（不可恢复！）"
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: inputs.confirm == 'DELETE'
    env:
      UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 unikraft CLI
        run: |
          VER=v0.4.2
          curl -sL -o /tmp/u.tgz "https://github.com/unikraft-cloud/cli/releases/download/${VER}/unikraft-cli_0.4.2_linux_amd64.tar.gz"
          tar xzf /tmp/u.tgz -C /tmp
          sudo mv /tmp/unikraft /usr/local/bin/unikraft

      - name: 清空全部资源
        run: |
          set -e
          TOKEN="$UNIKRAFT_API_TOKEN"
          ORG=$(printf '%s' "$TOKEN" | base64 -d | cut -d: -f1 | sed -e 's/^robot\$//' -e 's/\.users\.kraftcloud$//')
          printf '%s' "$TOKEN" | unikraft login --token=- --organization "$ORG" >/dev/null

          # instances/services list 不带 --metro 只会返回 CLI 默认地区的资源，
          # 逐个地区显式查询才能把所有地区的东西真正清空干净。
          METROS="sin dal fra sfo was"

          echo "== 删除实例 =="
          for M in $METROS; do
            unikraft instances list --metro "$M" -o json 2>/dev/null | jq -r '.[].name' | sort -u | while read -r n; do
              [ -n "$n" ] || continue
              echo "  [$M] 删除实例 $n"; unikraft instances delete "$n" --metro "$M" --force || true
            done
          done
          sleep 3

          echo "== 删除服务 =="
          for M in $METROS; do
            unikraft services list --metro "$M" -o json 2>/dev/null | jq -r '.[].name' | sort -u | while read -r n; do
              [ -n "$n" ] || continue
              echo "  [$M] 删除服务 $n"; unikraft services delete "$n" --metro "$M" || true
            done
          done

          echo "== 删除镜像 =="
          unikraft images list -o json 2>/dev/null | jq -r '.[].ref' | sort -u | while read -r r; do
            [ -n "$r" ] || continue
            echo "  删除镜像 $r"; unikraft images delete "$ORG/$(basename "$r")" || true
          done

          echo ""
          echo "== 剩余检查 =="
          for M in $METROS; do
            n=$(unikraft instances list --metro "$M" -o json 2>/dev/null | jq -r 'length')
            echo "  [$M] 剩余实例: $n"
          done
